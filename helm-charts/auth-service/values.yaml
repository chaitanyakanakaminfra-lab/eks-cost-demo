# Well-tuned — requests match actual usage
# Cost tool expected result: HEALTHY
replicaCount: 2

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "200m"
    memory: "256Mi"

service:
  type: ClusterIP
  port: 80
