# Simulates overprovisioned team that never revisited resource requests
# Requests 2 CPU per pod but nginx uses ~5-10 millicores
# Cost tool expected result: OVERPROVISIONED — waste > 80%
replicaCount: 4

image:
  repository: nginx
  tag: alpine
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "2000m"
    memory: "4Gi"
  limits:
    cpu: "4000m"
    memory: "8Gi"

service:
  type: ClusterIP
  port: 80
