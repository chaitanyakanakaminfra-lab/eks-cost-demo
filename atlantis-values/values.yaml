orgAllowlist: "github.com/chaitanyakanakaminfra-lab/*"

github:
  user: chaitanyakanakaminfra-lab
  token: "placeholder-overridden-by-env"
  secret: "placeholder-overridden-by-env"

repoConfig: |
  repos:
  - id: github.com/chaitanyakanakaminfra-lab/eks-cost-demo
    allowed_overrides: [workflow]
    allow_custom_workflows: true

  workflows:
    cost-aware:
      plan:
        steps:
          - plan
      apply:
        steps:
          - apply

service:
  type: LoadBalancer

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::535709430661:role/eks-cost-demo-atlantis"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

volumeClaim:
  enabled: false

statefulSet:
  securityContext:
    runAsUser: 100
    runAsGroup: 1000
    fsGroup: 1000

environment:
  AWS_REGION: us-east-1

hidePrevPlanComments: true
disableApplyAll: false
