orgAllowlist: "github.com/chaitanyakanakaminfra-lab/*"

github:
  user: chaitanyakanakaminfra-lab
  token:
    secretName: atlantis-github-secrets
    secretKey: github-token
  secret:
    secretName: atlantis-github-secrets
    secretKey: webhook-secret

repoConfig: |
  repos:
  - id: github.com/chaitanyakanakaminfra-lab/eks-cost-demo
    allowed_overrides: [workflow]
    allow_custom_workflows: true

  workflows:
    cost-aware:
      plan:
        steps:
          - plan
      apply:
        steps:
          - apply
          - run: |
              echo "Running EKS Cost Attribution Engine..."
              cd $BASE_REPO_DIR
              pip install -q -r eks-cost-attribution/requirements.txt
              python eks-cost-attribution/main.py \
                --cluster eks-cost-demo \
                --region   us-east-1 \
                --format   markdown \
                --atlantis
              echo "Cost attribution complete."

service:
  type: LoadBalancer

serviceAccount:
  create: true
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::535709430661:role/eks-cost-demo-atlantis"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

volumeClaim:
  enabled: true
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

environmentSecrets:
  - name: AWS_REGION
    valueFrom:
      secretKeyRef:
        name: atlantis-aws-config
        key: region

hidePrevPlanComments: true
disableApplyAll: false
